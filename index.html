<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page
    </title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    
    
    <div class="login-box">
        <h1>Enter your details to sign up
        </h1>

        <form action="/login" method="POST">
            
           <input type="text" name="name" placeholder="Enter your name" required autocomplete="name">
           <input type="email" name="email" placeholder="Enter your email" required autocomplete="email">
           <input type="password" name="password" placeholder="Create your password" required autocomplete="new-password">
           <input type="password" name="confirm_password" placeholder="Confirm your password" required autocomplete="new-password"  >
            <button type="submit">Sign Up</button>
        </form>

</body>
</html>
